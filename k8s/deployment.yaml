apiVersion: apps/v1
kind: Deployment
metadata:
  name: amazon-service
  labels:
    app: amazon-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: amazon-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: amazon-service
    spec:
      containers:
        - name: amazon
          image: amazon-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi